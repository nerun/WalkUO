name: C# 5 Syntax

on:
  push:
  pull_request:

jobs:
  csharp5-syntax:
    name: C# 5 Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel

      - name: Check C# 5 syntax
        run: |
          find . -name '*.cs' -print0 | \
            xargs -0 mcs -langversion:5 -unsafe --parse
